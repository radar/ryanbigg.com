<!DOCTYPE HTML>
<html lang="en">
{% include head.html %}

<body>
  <div class="flex">
    <div class='text-center mr-8'>
      <h1 class="my-0 mt-4 ml-4"><a href='/'>Ryan Bigg</a></h1>
      <a href="/blog">&#x27F5; Posts</a>
    </div>

    <div class="post-title ml-auto">
      <a href="{{ page.url }}">
        <h2 class="my-0 mt-4">{{ page.title }}</h2>
      </a>
      <small>{{ page.date | date_to_string }}</small>
    </div>
  </div>

  <div class="main">
    <div class='content'>
      <div class='content-inner'>
        <article class="mt-8 mb-16">
          {{content}}
        </article>
      </div>
    </div>
  </div>
  {% include footer.html %}

</body>

</html>
